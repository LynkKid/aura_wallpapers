<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraWall AI - 4K UHD AI Wallpapers, Double Pairs &amp; 4D Parallax Studio</title>
    <style>
        :root {
            --primary: #00f5d4;
            --primary-dark: #0891b2;
            --bg: #070b14;
            --card-bg: rgba(16, 24, 41, 0.82);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(0, 245, 212, 0.25);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #131c31, #070b14);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .app-badge {
            display: inline-block;
            background: rgba(0, 245, 212, 0.14);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 245, 212, 0.35);
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, #ffffff 30%, #00f5d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1.08rem;
            line-height: 1.6;
            margin: 0 0 36px 0;
        }
        .nav-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: #070b14;
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-badge">4K UHD AI &bull; C2PA Verified &bull; 120Hz 4D Parallax</div>
        <h1>AuraWall AI</h1>
        <p class="subtitle">
            Curated 4K UHD AI Wallpapers, Lock &amp; Home Double Wallpaper Pairs, 4-Layer 120Hz Gyroscope Parallax Studio, Smart Auto-Changer, and Quick Studio Editor.
        </p>

        <div class="nav-links">
            <a href="privacy-policy.html" class="btn btn-primary">Privacy Policy</a>
            <a href="terms-of-service.html" class="btn btn-outline">Terms of Service</a>
        </div>

        <footer>
            &copy; 2026 AuraWall AI. Developed by LynkKid.
        </footer>
    </div>
</body>
</html>
